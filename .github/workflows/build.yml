name: Build Maya APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project (unzips project.zip if you uploaded the zip)
        run: |
          if [ -f project.zip ]; then rm -rf _proj && mkdir _proj && unzip -q project.zip -d _proj; fi
          S=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          echo "ROOT=$(dirname "$S")" >> "$GITHUB_ENV"
          echo "Project root: $(dirname "$S")"

      - name: Use my photo as the app icon
        run: |
          IC=""
          [ -f icon.png ] && IC=icon.png
          [ -f icon.jpg ] && IC=icon.jpg
          if [ -n "$IC" ]; then
            R="$ROOT/app/src/main/res"
            rm -f "$R/drawable/ic_launcher.xml"
            mkdir -p "$R/drawable-nodpi"
            cp "$IC" "$R/drawable-nodpi/ic_launcher.${IC##*.}"
            echo "Icon replaced with $IC"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" Maya-AI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Maya-AI-apk
          path: Maya-AI.apk

      - name: Publish release (download link for your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maya-latest
          name: Maya AI (latest build)
          files: Maya-AI.apk
          make_latest: true
